    <style>
:root {
  --ink: #12261b;
  --ink-2: #4a5a50;
  --ink-3: #7c8a81;
  --forest: #14532d;
  --forest-2: #0e3d21;
  --leaf: #1f9d55;
  --lime: #bef264;
  --paper: #f5f4ee;
  --card: #ffffff;
  --line: #e5e3d8;
  --line-2: #efeee6;
  --danger: #b42318;
  --danger-bg: #fdecea;
  --warn: #9a6700;
  --warn-bg: #fff4d6;
  --info: #175cd3;
  --info-bg: #e6efff;
  --ok: #15693a;
  --ok-bg: #dcf5e4;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(18, 38, 27, 0.05), 0 6px 18px rgba(18, 38, 27, 0.05);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Fraunces", Georgia, serif;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 21px; }
h3 { font-size: 17px; }
p { margin: 0; }
a { color: var(--forest); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100%; }
.sidebar {
  background: var(--forest-2);
  color: #e6efe9;
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-family: var(--display); font-size: 21px; font-weight: 600; color: #fff; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--lime); color: var(--forest-2); display: grid; place-items: center; }
.nav-label { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: #8fb09c; padding: 14px 12px 6px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px;
  color: #cfe0d5; font-weight: 500; text-decoration: none;
}
.nav a:hover { background: rgba(255, 255, 255, 0.07); }
.nav a.active { background: var(--lime); color: var(--forest-2); }
.sidebar-foot { margin-top: auto; padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #2b6b46; color: #fff; display: grid; place-items: center; font-weight: 600; flex: none; }
.who { min-width: 0; flex: 1; }
.who b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.who span { font-size: 12px; color: #9fbfab; }
.icon-btn { background: transparent; border: 0; color: #cfe0d5; padding: 6px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: rgba(255, 255, 255, 0.1); }

.main { padding: 32px 40px 64px; max-width: 1180px; width: 100%; min-width: 0; }
.topbar-m { display: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-head p { color: var(--ink-2); margin-top: 6px; max-width: 60ch; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; z-index: 40; inset: 0 auto 0 0; width: 272px; transform: translateX(-102%);
    transition: transform 0.2s ease; height: 100%;
  }
  .sidebar.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.4); }
  .topbar-m {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--forest-2); color: #fff;
    position: sticky; top: 0; z-index: 30; font-family: var(--display); font-size: 18px; font-weight: 600;
  }
  .main { padding: 22px 16px 56px; }
  h1 { font-size: 25px; }
}

/* ---------- surfaces ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card.flat { box-shadow: none; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 980px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .split { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: 13px; }
.sm { font-size: 13px; }

/* ---------- stat tiles ---------- */
.stat { padding: 18px 20px; }
.stat .label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.stat .num { font-family: var(--display); font-size: 36px; font-weight: 600; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.stat.hero { background: var(--forest); color: #fff; border-color: var(--forest); }
.stat.hero .label, .stat.hero .sub { color: #b9d6c5; }
.delta-up { color: var(--danger); } .delta-down { color: var(--ok); }

/* ---------- forms ---------- */
label.field { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; font-size: 13.5px; font-weight: 500; align-content: flex-start; }
label.field > .hint { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
label.field > .input { flex: 1 0 100%; }
.input, select.input, textarea.input {
  width: 100%; padding: 10px 12px; border: 1px solid #d3d1c4; border-radius: 10px; background: #fff; font-weight: 400;
}
textarea.input { min-height: 104px; resize: vertical; }
.input:focus { outline: 2px solid var(--leaf); outline-offset: 0; border-color: var(--leaf); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--forest); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent;
  background: var(--forest); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer;
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--forest-2); text-decoration: none; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.lime { background: var(--lime); color: var(--forest-2); }
.btn.lime:hover { background: #a9e04a; }
.btn.ghost { background: #fff; color: var(--ink); border-color: #d3d1c4; }
.btn.ghost:hover { background: #f1f0e8; }
.btn.danger { background: var(--danger); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.badge i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.b-pending { background: var(--warn-bg); color: var(--warn); }
.b-acknowledged { background: var(--info-bg); color: var(--info); }
.b-in_progress { background: #eee9ff; color: #5b3fc4; }
.b-resolved { background: var(--ok-bg); color: var(--ok); }
.b-closed { background: #ececE4; color: #555f58; }
.b-rejected { background: var(--danger-bg); color: var(--danger); }
.p-low { background: #ececE4; color: #555f58; }
.p-medium { background: var(--info-bg); color: var(--info); }
.p-high { background: var(--warn-bg); color: var(--warn); }
.p-urgent { background: var(--danger-bg); color: var(--danger); }
.tag { display: inline-flex; padding: 2px 9px; border-radius: 8px; background: var(--line-2); color: var(--ink-2); font-size: 12.5px; }
.verified { color: var(--ok); display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }

/* ---------- lists / tables ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line-2); align-items: flex-start; color: inherit; }
.item:last-child { border-bottom: 0; }
a.item:hover { background: #faf9f4; text-decoration: none; }
.item .grow { flex: 1; min-width: 0; }
.item .title { font-weight: 600; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.t td { padding: 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: #faf9f4; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid #d3d1c4; background: #fff; border-radius: 999px; padding: 6px 13px; font-size: 13.5px; cursor: pointer; font-weight: 500; }
.chip:hover { background: #f1f0e8; }
.chip.on { background: var(--forest); color: #fff; border-color: var(--forest); }

.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; color: var(--ink-2); font-size: 13.5px; }

/* ---------- misc ---------- */
.notice { padding: 11px 14px; border-radius: 10px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.notice.err { background: var(--danger-bg); color: var(--danger); }
.notice.ok { background: var(--ok-bg); color: var(--ok); }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.info { background: var(--info-bg); color: var(--info); }
.empty { text-align: center; padding: 44px 16px; color: var(--ink-2); }
.empty .ico { width: 52px; height: 52px; border-radius: 16px; background: var(--line-2); display: grid; place-items: center; margin: 0 auto 14px; color: var(--forest); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--forest); animation: spin 0.7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.center { display: grid; place-items: center; padding: 56px 0; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 40px; gap: 12px; align-items: center; font-size: 14px; margin: 9px 0; }
.bar { height: 10px; background: var(--line-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--leaf); }
.cat-dot { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }

.timeline { position: relative; margin: 0; padding: 0 0 0 22px; list-style: none; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { position: relative; padding-bottom: 18px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: -21px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--leaf); }
.timeline li:first-child::before { background: var(--leaf); }

.stars { display: inline-flex; gap: 2px; }
.stars button { background: none; border: 0; padding: 2px; cursor: pointer; color: #cdcabb; }
.stars button.on, .stars .on { color: #e6a700; }

.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
.toast { background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); max-width: 360px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.toast.err { background: var(--danger); }

.modal-back { position: fixed; inset: 0; background: rgba(10, 25, 16, 0.5); display: grid; place-items: center; padding: 16px; z-index: 60; }
.modal { background: #fff; border-radius: 18px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; padding: 24px; }

/* ---------- auth ---------- */
.auth { min-height: 100%; display: grid; grid-template-columns: 1.05fr 1fr; }
.auth-art {
  background: radial-gradient(1000px 500px at 10% 0%, #1f6b3e 0%, transparent 60%), var(--forest-2);
  color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
}
.auth-art h1 { font-size: 46px; max-width: 14ch; line-height: 1.05; }
.auth-art p { color: #bcd7c6; max-width: 44ch; margin-top: 16px; font-size: 16px; }
.auth-art .loop { position: absolute; right: -90px; bottom: -90px; opacity: 0.12; }
.points { display: grid; gap: 14px; margin-top: 8px; }
.points div { display: flex; gap: 12px; align-items: center; color: #d8ebdf; }
.points span { width: 34px; height: 34px; border-radius: 10px; background: rgba(190, 242, 100, 0.16); color: var(--lime); display: grid; place-items: center; flex: none; }
.auth-form { display: grid; place-items: center; padding: 32px 20px; }
.auth-form .box { width: 100%; max-width: 400px; }
.demo { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
@media (max-width: 860px) { .auth { grid-template-columns: 1fr; } .auth-art { display: none; } }

.hero-banner {
  background: linear-gradient(135deg, var(--forest) 0%, #1c7a43 100%); color: #fff; border-radius: 20px; padding: 28px 30px;
  display: flex; justify-content: space-between; gap: 20px; align-items: center; flex-wrap: wrap; position: relative; overflow: hidden;
}
.hero-banner h2 { font-size: 26px; }
.mini { font-family: var(--display); font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-banner p { color: #cfe6d7; margin-top: 6px; max-width: 48ch; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    </style>
  </head>

  /* ============================ API ============================ */
  function ApiError(status, message) { this.status = status; this.message = message; }
  ApiError.prototype = Object.create(Error.prototype);

  var token = store.get("cleanloop.token");
  var me = null;
  var GUEST = { id: "guest", full_name: "Guest", role: "admin", email: "" };
  var user = function () { return me || GUEST; };
  var isStaff = function () { var r = user().role; return r === "municipal_staff" || r === "admin"; };

  function parseDetail(body, fallback) {
    if (body && typeof body === "object" && body.detail != null) {
      var d = body.detail;
      if (typeof d === "string") return d;
      if (Array.isArray(d)) return d.map(function (e) {
        var loc = Array.isArray(e.loc) ? e.loc.filter(function (p) { return p !== "body"; }).join(".") : "";
        return (loc ? loc + ": " : "") + (e.msg || "Invalid input");
      }).join("; ");
    }
    return fallback;
  }

  async function api(path, o) {
    o = o || {};
    var auth = o.auth !== false;
    var qs = "";
    if (o.query) {
      qs = Object.keys(o.query).filter(function (k) { var v = o.query[k]; return v !== undefined && v !== null && v !== ""; })
        .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(o.query[k]); }).join("&");
    }
    var headers = {}, body;
    if (auth && token) headers.Authorization = "Bearer " + token;
    if (o.form) { headers["Content-Type"] = "application/x-www-form-urlencoded"; body = o.form; }
    else if (o.body !== undefined) { headers["Content-Type"] = "application/json"; body = JSON.stringify(o.body); }
    var res;
    try { res = await fetch(API + path + (qs ? "?" + qs : ""), { method: o.method || "GET", headers: headers, body: body }); }
    catch (e) { throw new ApiError(0, "Can't reach the server at " + API + ". Check that the backend is running and allows this origin (CORS)."); }
    var text = await res.text(), data = null;
    if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
    if (!res.ok) {
      if (res.status === 401 && auth && !token) throw new ApiError(401, "This data needs a signed-in account on the API. Set DEMO_EMAIL and DEMO_PASSWORD at the top of this file, or relax auth on the backend.");
      if (res.status === 401 && auth && token) { token = null; me = null; store.del("cleanloop.token"); renderUser(); }
      throw new ApiError(res.status, parseDetail(data, "Request failed (" + res.status + ")"));
    }
    return data;
  }

  /* ============================ OFFLINE QUEUE ============================ */
  var QKEY = "cleanloop.offlineQueue";
  function readQueue() { try { return JSON.parse(store.get(QKEY) || "[]"); } catch (e) { return []; } }
  function writeQueue(q) { store.set(QKEY, JSON.stringify(q)); renderSync(); }
  function renderSync() {
    var box = $("#syncbox"); if (!box) return;
    var q = readQueue().length, online = navigator.onLine;
    if (!q && online) { box.innerHTML = ""; return; }
    box.innerHTML = '<div class="notice warn" style="margin:10px 4px 0;font-size:13px;flex-direction:column;gap:8px;align-items:stretch"><div class="row" style="gap:8px">' + icon("off", 16) +
      "<b>" + (online ? "Waiting to sync" : "You're offline") + "</b></div><span>" + q + " complaint" + (q === 1 ? "" : "s") + " saved on this device.</span>" +
      (online && q ? '<button class="btn lime sm" id="syncnow">Sync now</button>' : "") + "</div>";
    var b = $("#syncnow"); if (b) b.onclick = function () { flush(false); };
  }
  async function flush(silent) {
    var q = readQueue(); if (!q.length) return;
    try {
      var res = await api("/sync/complaints", { method: "POST", body: { complaints: q } });
      var failed = {};
      (res.errors || []).forEach(function (e) { if (e && e.client_generated_id) failed[e.client_generated_id] = 1; });
      var rest = q.filter(function (c) { return c.client_generated_id && failed[c.client_generated_id]; });
      writeQueue(rest);
      if (q.length - rest.length) toast("Synced " + (q.length - rest.length) + " offline complaint(s)");
      if (rest.length && !silent) toast(rest.length + " could not be synced yet", "err");
    } catch (e) { if (!silent) toast(e.message, "err"); }
  }

    var d = r[0].value, hs = r[1];
    var status = d.status_breakdown.map(function (s) { return { key: normStatus(s.status), count: s.count }; });
    var total = Math.max(1, d.total_complaints);
    var maxCat = Math.max.apply(null, [1].concat(d.category_breakdown.map(function (c) { return c.count; })));
    var resolved = (status.filter(function (s) { return s.key === "resolved"; })[0] || { count: 0 }).count;
    var delta = d.complaints_last_month ? Math.round(((d.complaints_this_month - d.complaints_last_month) / d.complaints_last_month) * 100) : null;

    view.innerHTML = pageHead("Analytics", "Complaint volume, response times and where problems cluster.") +
      '<div class="grid g4" style="margin-bottom:16px"><div class="card stat hero"><div class="label">' + icon("inbox", 16) + " Total complaints</div><div class=\"num\">" + d.total_complaints + "</div></div>" +
      '<div class="card stat"><div class="label">' + icon("check", 16) + ' Resolution rate</div><div class="num">' + Math.round((resolved / total) * 100) + '%</div><div class="sub">' + resolved + " resolved</div></div>" +
      '<div class="card stat"><div class="label">' + icon("clock", 16) + ' Avg. time to resolve</div><div class="num">' + fmtHours(d.avg_resolution_hours) + "</div></div>" +
      '<div class="card stat"><div class="label">' + icon("chart", 16) + ' This month</div><div class="num">' + d.complaints_this_month + '</div><div class="sub">' +
      (delta === null ? d.complaints_last_month + " last month" : '<span class="' + (delta > 0 ? "delta-up" : "delta-down") + '">' + (delta > 0 ? "+" : "") + delta + "% vs last month (" + d.complaints_last_month + ")</span>") + "</div></div></div>" +
      '<div class="grid g2" style="margin-bottom:16px"><div class="card"><div class="card-title"><h2>By status</h2></div>' + (status.length
        ? '<div style="display:flex;height:14px;border-radius:999px;overflow:hidden;margin-bottom:14px">' + status.map(function (s) { return '<span style="width:' + (s.count / total) * 100 + "%;background:" + (STATUS_COLOR[s.key] || "#999") + '"></span>'; }).join("") + "</div>" +
          status.map(function (s) {
            return '<div class="bar-row"><span class="row" style="gap:8px"><i style="width:9px;height:9px;border-radius:50%;background:' + (STATUS_COLOR[s.key] || "#999") + '"></i>' + esc(STATUS_LABEL[s.key] || s.key) + '</span><div class="bar"><span style="width:' + (s.count / total) * 100 + "%;background:" + (STATUS_COLOR[s.key] || "#999") + '"></span></div><b style="text-align:right">' + s.count + "</b></div>";
          }).join("") : '<p class="muted">No data yet.</p>') + "</div>" +
      '<div class="card"><div class="card-title"><h2>By waste category</h2></div>' + (d.category_breakdown.length ? d.category_breakdown.slice().sort(function (a, b) { return b.count - a.count; }).map(function (c) {
        return '<div class="bar-row"><span class="clip">' + esc(c.category_name) + '</span><div class="bar"><span style="width:' + (c.count / maxCat) * 100 + '%"></span></div><b style="text-align:right">' + c.count + "</b></div>";
      }).join("") : '<p class="muted">No data yet.</p>') + "</div></div>" +
      '<div class="card"><div class="card-title"><h2 class="row">' + icon("flame", 20) + " Complaint hotspots</h2></div>" + (hs.status === "rejected" ? notice("err", esc(hs.reason.message))
        : !hs.value.hotspots.length ? empty("chart", "No hotspots yet", "Hotspots appear once complaints with locations come in.")
          : '<div class="table-wrap"><table class="t"><thead><tr><th>#</th><th>Locality</th><th>Top category</th><th>Complaints</th><th></th></tr></thead><tbody>' + hs.value.hotspots.map(function (h, i) {
            return '<tr><td class="faint">' + (i + 1) + "</td><td><b>" + esc(h.locality || "Unknown") + '</b></td><td><span class="tag">' + esc(h.top_category) + "</span></td><td><b>" + h.complaint_count + '</b></td><td><a class="row sm" href="' + mapsLink(h.latitude, h.longitude) + '" target="_blank" rel="noreferrer">' + icon("pin", 14) + " Map</a></td></tr>";
          }).join("") + "</tbody></table></div>") + "</div>";
  }

  /* ============================ ROUTER ============================ */
  var routing = 0;
  async function route() {
    var my = ++routing;
    var h = location.hash || "#/";
    markNav(); reset();
    view.innerHTML = spinner;
    window.scrollTo(0, 0);
    var m;
    try {
      if ((m = h.match(/^#\/complaint\/(.+)$/))) await pageDetail(decodeURIComponent(m[1]));
      else if (h.indexOf("#/waste-guide") === 0) await pageWaste();
      else if (h.indexOf("#/facilities") === 0) await pageFacilities();
      else if (h.indexOf("#/report") === 0) await pageReport();
      else if (h.indexOf("#/mine") === 0) await pageList("mine");
      else if (h.indexOf("#/manage") === 0) await pageList("all");
      else if (h.indexOf("#/analytics") === 0) await pageAnalytics();
      else await pageDashboard();
    } catch (e) {
      if (my !== routing) return;
      view.innerHTML = pageHead("Something went wrong") + notice("err", esc((e && e.message) || String(e))) +
        '<p style="margin-top:16px"><a class="btn ghost" href="#/">Back to dashboard</a></p>';
    }
  }

  /* ============================ BOOT ============================ */
  async function boot() {
    buildShell();
    renderSync();
    try {
      if (!token && CONFIG.DEMO_EMAIL && CONFIG.DEMO_PASSWORD) {
        var t = await api("/auth/login", { method: "POST", auth: false, form: new URLSearchParams({ username: CONFIG.DEMO_EMAIL, password: CONFIG.DEMO_PASSWORD }) });
        token = t.access_token; store.set("cleanloop.token", token);
      }
      if (token) me = await api("/auth/me");
    } catch (e) { token = null; me = null; store.del("cleanloop.token"); }
    renderUser();
    window.addEventListener("hashchange", route);
    window.addEventListener("online", function () { renderSync(); flush(true); });
    window.addEventListener("offline", renderSync);
    if (navigator.onLine && token) flush(true);
    route();
  }
  boot().catch(function (e) {
    document.getElementById("app").innerHTML = '<div style="padding:32px;font-family:system-ui"><h2>Clean Loop failed to start</h2><pre style="white-space:pre-wrap">' + esc(e && e.message || e) + "</pre></div>";
  });
})();

    </script>
  </body>
</html>
